[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cooperage-sdk"
version = "0.1.0"
description = "Lightweight helpers for writing Cooperage-compatible MCP servers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.0.0",
    "uvicorn>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cooperage_sdk"]
